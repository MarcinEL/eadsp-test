<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Results</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body { background-color: #f8f9fa; }
    .container { margin-top: 80px; }
    .result-card {
      padding: 20px;
      border-radius: 8px;
      background-color: #fff;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="result-card">
      <h1>Test Results for {{ filename }}</h1>
      <p><strong>{{ results.message }}</strong></p>
      <p>Detected peak frequencies (Hz): {{ results.peak_frequencies }}</p>
      
      {% if results.plot_html %}
        <h3>Interactive FFT Plots:</h3>
        <!-- Render the interactive Plotly figure -->
        <div>
          {{ results.plot_html|safe }}
        </div>
      {% else %}
        <p>No plot available.</p>
      {% endif %}
      
      <a href="{{ url_for('index') }}" class="btn btn-primary mt-3">Test Another File</a>
    </div>
  </div>
  <!-- Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
