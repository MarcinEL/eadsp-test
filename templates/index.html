<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload Student Work</title>
  <!-- Bootstrap CSS from CDN -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .container {
      margin-top: 80px;
      max-width: 600px;
    }
    .card {
      padding: 30px;
      border: none;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    h1 {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1 class="text-center">Upload Your Work</h1>
      <p class="text-center text-muted">
        Please upload your Python script containing your FFT implementation.
      </p>
      
      <!-- Display flash messages (if any) -->
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="alert alert-info" role="alert">
            {% for message in messages %}
              <p>{{ message }}</p>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
      
      <form id="uploadForm" action="{{ url_for('upload') }}" method="POST" enctype="multipart/form-data">
        <div class="form-group">
          <label for="studentFile">Select File</label>
          <input type="file" class="form-control-file" id="studentFile" name="studentFile" accept=".py" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Upload and Test</button>
      </form>
    </div>
  </div>

  <!-- Optional JavaScript and Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
